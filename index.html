<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F7F5F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12110F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Training">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Magner Training</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: warm paper ground, light data cards and dark "instrument" cards, mono eyebrows and numbers, earthy zone colours. Single column on phone, two columns on desktop. */
:root{
  --bg:#F7F5F0; --card:#FFFFFF; --sunken:#EFECE5; --input:#ECE9E2;
  --ink:#23211C; --ink2:#5A564D; --ink3:#8E887C; --line:#E3DFD5; --line2:#CFCABE;
  --accent:#B8652F; --accent-ink:#FFFFFF; --accentSoft:rgba(184,101,47,.12);
  --mbase:#E6E1D7; --mline:#CFCABE; --dark:#1D1B18; --dark2:#2A2723; --dline:rgba(242,238,230,.12); --on:#F2EEE6; --on2:rgba(242,238,230,.62); --on3:rgba(242,238,230,.38);
  --z-rec:#9AA6B2; --z-st:#7F9B70; --z-mp:#C68B33; --z-lt2:#C2632F; --z-vo2:#8A2C33; --z-sp:#6E4B7E; --z-x:#B5AFA3;
  --good:#5E8A55; --warn:#A87A2C; --bad:#A3392D;
  --shadow:0 1px 2px rgba(40,32,20,.05),0 8px 24px -14px rgba(40,32,20,.22);
  --sans:"Schibsted Grotesk","Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12110F; --card:#1B1916; --sunken:#24211D; --input:#2A2622; --mbase:#2C2824; --mline:#3A3530;
  --ink:#F2EEE6; --ink2:rgba(242,238,230,.68); --ink3:rgba(242,238,230,.42); --line:#2E2A25; --line2:#3D3832;
  --accent:#D47A3F; --accentSoft:rgba(212,122,63,.16);
  --dark:#0B0A09; --dark2:#1A1815; --dline:rgba(242,238,230,.10);
  --z-rec:#8D99A6; --z-st:#8BAA7B; --z-mp:#D29A44; --z-lt2:#D3723C; --z-vo2:#B4434B; --z-sp:#8E6AA0; --z-x:#6E685E;
  --good:#7DAA72; --warn:#C99A48; --bad:#D0574A;
  --shadow:0 1px 0 rgba(0,0,0,.4); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#12110F; --card:#1B1916; --sunken:#24211D; --input:#2A2622; --mbase:#2C2824; --mline:#3A3530;
  --ink:#F2EEE6; --ink2:rgba(242,238,230,.68); --ink3:rgba(242,238,230,.42); --line:#2E2A25; --line2:#3D3832;
  --accent:#D47A3F; --accentSoft:rgba(212,122,63,.16);
  --dark:#0B0A09; --dark2:#1A1815; --dline:rgba(242,238,230,.10);
  --z-rec:#8D99A6; --z-st:#8BAA7B; --z-mp:#D29A44; --z-lt2:#D3723C; --z-vo2:#B4434B; --z-sp:#8E6AA0; --z-x:#6E685E;
  --good:#7DAA72; --warn:#C99A48; --bad:#D0574A;
  --shadow:0 1px 0 rgba(0,0,0,.4); color-scheme:dark;
}
*{box-sizing:border-box}
html{padding-top:0}body{margin:0;padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}
.signin{max-width:420px;margin:12vh auto 0;padding-inline:16px}

html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eb{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3)}
.eb.acc{color:var(--accent)}
.dk .eb{color:var(--on3)}
h1{font-size:30px;font-weight:500;letter-spacing:-.03em;line-height:1.08;margin:6px 0 0;text-wrap:balance}
h2{font-size:21px;font-weight:500;letter-spacing:-.02em;line-height:1.15;margin:4px 0 0}
.lede{color:var(--ink2);font-size:14px;margin-top:4px}
.dk .lede{color:var(--on2)}

/* Shell */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top-in{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.mark{width:22px;height:22px;border-radius:50%;background:var(--ink);position:relative;flex:none}
.mark::after{content:"";position:absolute;inset:6px;border-radius:50%;border:2px solid var(--accent)}
.brand{font-weight:600;letter-spacing:-.01em;font-size:16px}
.top .sp{flex:1}
.race{font-family:var(--mono);font-size:11px;color:var(--ink2);background:var(--sunken);border-radius:999px;padding:5px 10px;white-space:nowrap}
.race b{color:var(--accent);font-weight:500}
.navw{max-width:1080px;margin:0 auto;padding:0 16px 10px;overflow-x:auto;scrollbar-width:none}
.navw::-webkit-scrollbar{display:none}
.nav{display:inline-flex;gap:2px;background:var(--sunken);border-radius:999px;padding:3px}
.nav button{padding:7px 11px;border-radius:999px;font-size:13px;font-weight:500;color:var(--ink2);white-space:nowrap}
.nav button[aria-current="page"]{background:var(--dark);color:var(--on)}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:18px 48px}
.head{margin:4px 0 18px}
.cols{display:grid;gap:14px}
@media (min-width:880px){.cols.two{grid-template-columns:1.05fr 1fr;align-items:start}.span2{grid-column:1/-1}}
.stack{display:grid;gap:14px;min-width:0}

/* Cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);min-width:0}
.dk{background:var(--dark);color:var(--on);border:1px solid var(--dark);border-radius:16px;min-width:0}
.pad{padding:18px}
.ch{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.sub{color:var(--ink2);font-size:13px}
.dk .sub{color:var(--on2)}
.inset{background:var(--dark2);border-radius:12px;padding:14px}
.card .inset{background:var(--sunken)}

/* Metrics */
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px}
@media (max-width:520px){.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}}
.m .k{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.dk .m .k{color:var(--on3)}
.m .v{font-family:var(--mono);font-size:22px;font-weight:500;letter-spacing:-.02em;line-height:1.2;margin-top:2px}
.m .v small{font-size:11px;color:var(--ink3);margin-left:3px;font-weight:400}
.dk .m .v small{color:var(--on3)}

/* Pills / chips */
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:9px 14px;font-size:13px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line2)}
.dk .btn.ghost{color:var(--on);border-color:var(--dline)}
.btn.block{width:100%;justify-content:center;padding:12px}
.btn:disabled{opacity:.5}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:6px;background:var(--sunken);color:var(--ink2)}
.dk .chip{background:var(--dark2);color:var(--on2)}
.chip i{width:7px;height:7px;border-radius:2px;background:var(--zc,var(--z-x))}
.chip.good{color:var(--good)} .chip.warn{color:var(--warn)} .chip.bad{color:var(--bad)}
.seg{display:inline-flex;background:var(--sunken);border-radius:8px;padding:2px;gap:2px}
.dk .seg{background:var(--dark2)}
.seg button{font-family:var(--mono);font-size:11px;padding:5px 9px;border-radius:6px;color:var(--ink3)}
.dk .seg button{color:var(--on3)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.dk .seg button[aria-pressed="true"]{background:var(--on);color:var(--dark)}

/* Zone colours */
.z-rec{--zc:var(--z-rec)} .z-st{--zc:var(--z-st)} .z-mp{--zc:var(--z-mp)} .z-lt2{--zc:var(--z-lt2)} .z-vo2{--zc:var(--z-vo2)} .z-sp{--zc:var(--z-sp)} .z-x{--zc:var(--z-x)} .z-race{--zc:var(--accent)}
.pace{font-family:var(--mono);font-weight:500;white-space:nowrap;color:var(--zc,inherit)}

/* Session (dark) */
.sess-t{font-size:24px;font-weight:500;letter-spacing:-.02em;line-height:1.15;margin:6px 0 4px}
.sess-m{font-family:var(--mono);font-size:12px;color:var(--on2)}
.card .sess-m{color:var(--ink2)}
.how{margin-top:14px;font-size:15px;line-height:1.55}
.how b{font-weight:600}
.bul{display:grid;gap:8px;margin-top:12px;font-size:14px}
.bul div{display:grid;grid-template-columns:10px 1fr;gap:8px}
.bul div::before{content:"";width:7px;height:7px;border-radius:2px;margin-top:7px;background:var(--accent)}
.coach{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;border-left:3px solid var(--accent);padding:10px 12px;border-radius:0 10px 10px 0;background:var(--accentSoft);font-size:14px}
.coach .eb{color:var(--accent);margin-top:2px}
.dk .coach{background:rgba(212,122,63,.14)}

/* Week bars */
.bars{width:100%;height:auto;display:block;margin-top:10px}
.bars text{font-family:var(--mono);font-size:9px;fill:var(--ink3)}
.dk .bars text{fill:var(--on3)}
.lro{display:flex;flex-wrap:wrap;gap:4px 12px;font-family:var(--mono);font-size:11px;color:var(--on2);margin:14px 0 4px;min-height:16px}
.lro b{color:var(--on);font-weight:500}
.dotk{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:8px;vertical-align:1px;flex:none}
.acts{margin-top:12px}
.act{display:flex;align-items:flex-start;gap:0;padding:10px 0;border-top:1px solid var(--line)}
.act:first-child{border-top:0}
.act .dotk{margin-top:6px}
.act-a{flex:1;min-width:0;display:flex;flex-direction:column}
.act-a b{font-weight:500}
.act-n{text-align:right;display:flex;flex-direction:column;font-family:var(--mono)}
.act-n b{font-size:18px;font-weight:500}
.act-n .sub{font-size:10px}
.wk-list{margin-top:10px}
.wk-row{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.3fr) auto;gap:12px;align-items:center;width:100%;padding:10px 0;border:0;border-top:1px solid var(--line);background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.wk-row:first-child{border-top:0}
.wk-a{display:flex;flex-direction:column;min-width:0}
.wk-a b{font-weight:500}
.wk-a .sub{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk-bar{display:flex;height:10px;border-radius:3px;overflow:hidden;background:var(--sunken)}
.wk-bar i{display:block;height:100%;opacity:.85}
.wk-n{display:flex;flex-direction:column;text-align:right;font-family:var(--mono);min-width:64px}
.wk-n b{font-size:16px;font-weight:500}
.wk-n .sub{font-size:10px}
.share{height:6px;border-radius:3px;background:var(--sunken);margin-top:6px;overflow:hidden}
.share i{display:block;height:100%;opacity:.85}
.defs{margin:8px 0 0}
.defs dt{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-top:12px}
.defs dd{margin:4px 0 0;font-size:14px;color:var(--ink2);line-height:1.5}
.chiprow{display:inline-flex;flex-wrap:wrap;gap:4px 8px;margin-left:6px}
.chipx{display:inline-flex;align-items:center;gap:4px;font-size:12px}
.chipx i{width:7px;height:7px;border-radius:2px;display:inline-block}
.wchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.wchip{display:inline-flex;align-items:center;gap:6px;background:var(--sunken);border-radius:999px;padding:5px 10px;font-family:var(--mono);font-size:12px;color:var(--ink2)}
.wchip i{width:8px;height:8px;border-radius:2px;display:inline-block}
.wchip b{font-family:var(--sans);font-weight:500;color:var(--ink)}
.dk .wchip{background:var(--dark2);color:var(--on2)}
.dk .wchip b{color:var(--on)}
.wkday.focus{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.wk-big{font-family:var(--mono);font-size:22px;white-space:nowrap}
.wk-big .sub{font-size:13px}
.wk-read{font-size:14px;color:var(--ink2);margin-top:10px;line-height:1.45}
.linkrow{display:flex;justify-content:space-between;align-items:center;width:100%;margin-top:14px;padding:12px 0 0;border-top:1px solid var(--line);font-weight:500;color:inherit}
.linkrow span:last-child{color:var(--ink3);font-size:18px}
.sportbars{margin-top:14px;display:grid;gap:8px}
.sb{display:grid;grid-template-columns:88px 1fr 56px;gap:10px;align-items:center;font-size:13px}
.sb-l{display:flex;align-items:center}
.sb-bar{height:8px;border-radius:4px;background:var(--dark2);overflow:hidden}
.sb-bar i{display:block;height:100%}
.sb-v{text-align:right;font-family:var(--mono);color:var(--on2)}
.wkdays{display:grid;gap:8px;margin-top:12px}
.wkd-slim,.wkd-head{display:grid;grid-template-columns:62px minmax(0,1fr) auto auto;gap:10px;align-items:center;width:100%;text-align:left;color:inherit;font:inherit}
.wkd-slim{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.wkd{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.wkd.today,.wkd-slim.today{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.wkd.focus,.wkd-slim.focus{box-shadow:0 0 0 2px var(--accent)}
.wkd-date{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.wkd.today .wkd-date,.wkd-slim.today .wkd-date{color:var(--accent)}
.wkd-t{display:flex;flex-direction:column;min-width:0;font-weight:500}
.wkd-t .sub{font-weight:400;font-size:12px}
.wkd-n{font-family:var(--mono);font-size:15px}
.wkd-n small{font-size:10px;color:var(--ink3)}
.wkd-slim .r,.wkd-head .r{color:var(--ink3)}
.wkd .acts{margin-top:6px;padding-left:72px}
.wkd-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;padding-left:72px}
.wkd-tags span{font-size:12px;background:var(--sunken);border-radius:999px;padding:3px 9px;color:var(--ink2)}
.wkd-note{display:block;text-align:left;margin-top:8px;padding-left:72px;font-size:13px;color:var(--ink2);line-height:1.45;width:100%}
.wkd-note.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
@media (max-width:420px){.wkd .acts,.wkd-tags,.wkd-note{padding-left:0}}
.dk{--mbase:#2E2A25;--mline:#3A3530}
.bodymap{width:100%;max-width:340px;display:block;margin:12px auto 4px}
.bodymap text{font-family:var(--mono);font-size:8px;letter-spacing:.12em;fill:var(--ink3)}
.dk .bodymap text{fill:var(--on3)}
.ulbar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--sunken);margin-top:10px}
.dk .ulbar{background:var(--dark2)}
.ulbar i{display:block;height:100%}
.ulbar .u,.ullab .u{background:var(--accent)}.ulbar .l,.ullab .l{background:var(--z-st)}.ulbar .c,.ullab .c{background:var(--z-rec)}
.ullab{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px;font-family:var(--mono);font-size:11px;color:var(--ink2)}
.dk .ullab{color:var(--on2)}
.ullab span{display:inline-flex;align-items:center;gap:5px}.ullab i{width:8px;height:8px;border-radius:2px;display:inline-block}
.mrank{display:grid;gap:7px;margin-top:14px}
.mr{display:grid;grid-template-columns:92px 1fr 64px;gap:10px;align-items:center;font-size:13px}
.mr-bar{height:8px;border-radius:4px;background:var(--sunken);overflow:hidden}.mr-bar i{display:block;height:100%;background:var(--accent);opacity:.85}
.mr .mono{text-align:right}.mr small{color:var(--ink3);font-size:10px}
.gbig{font-family:var(--mono);font-size:40px;letter-spacing:-.03em;margin-top:8px}
.gbig small{font-size:13px;color:var(--ink3);letter-spacing:0}
.dk .gbig small{color:var(--on3)}
.wkt{display:flex;align-items:flex-end;gap:4px;height:70px;margin-top:8px}
.wkt span{flex:1;height:100%;display:flex;align-items:flex-end}
.wkt i{display:block;width:100%;border-radius:3px 3px 1px 1px;background:var(--line2)}
.wkt i.cur{background:var(--accent)}
.wkt-lab{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--ink3);margin-top:4px}
.gymstart .tplgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:14px}
.tpl{display:flex;flex-direction:column;gap:2px;text-align:left;padding:12px 14px;border-radius:12px;background:var(--dark2);color:var(--on)}
.tpl b{font-weight:500}.tpl span{font-size:12px;color:var(--on3)}
.tpl.main{grid-column:1/-1;background:var(--accent);color:#fff}.tpl.main span{color:rgba(255,255,255,.8)}
.glist{display:grid;gap:0;margin-top:8px}
.grow{display:grid;grid-template-columns:80px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--line);text-align:left;color:inherit}
.grow:first-child{border-top:0}
.actbtn{width:100%;text-align:left;color:inherit;font:inherit}
.matchnote{font-size:12px;color:var(--ink3);margin:10px 4px 0;line-height:1.45}
.liftlink{display:flex;gap:10px;align-items:center;width:100%;margin-top:8px;padding:10px 12px;border-radius:10px;background:var(--sunken);color:inherit;text-align:left;font-size:14px}
.liftlink b{font-weight:500;flex:1}.liftlink span{font-family:var(--mono);font-size:12px;color:var(--ink2)}
.gex{padding:12px 0}.gex+.gex{border-top:1px solid var(--line)}
.gex-h{display:flex;gap:8px;align-items:center}.gex-h b{font-weight:500;flex:1}
.prb{font-family:var(--mono);font-size:10px;letter-spacing:.08em;background:var(--accent);color:#fff;border-radius:4px;padding:2px 6px}
.gsets{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.gsets span{font-family:var(--mono);font-size:12px;background:var(--sunken);border-radius:6px;padding:4px 8px}
.sheet.lg{padding-top:0}
.lg-top{position:sticky;top:0;z-index:2;display:flex;gap:8px;align-items:center;background:var(--bg);padding:12px 0 10px;border-bottom:1px solid var(--line)}
.lg-name{flex:1;min-width:0;font:inherit;font-weight:600;font-size:17px;background:none;border:0;color:var(--ink);padding:6px 4px}
.lg-strip{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-family:var(--mono);font-size:12px;color:var(--ink2);padding:10px 0}
.lg-strip b{color:var(--ink);font-size:15px}
.lg-when{margin-left:auto;display:flex;gap:6px}
.lg-min{display:inline-flex;align-items:center;gap:4px}
.lg-min input{width:46px;font:inherit;font-size:14px;font-weight:600;text-align:center;background:var(--input);border:0;border-radius:8px;padding:5px 4px;color:var(--ink)}
.lg-strip input[type=time]{font:inherit;font-size:12px;background:var(--input);border:0;border-radius:8px;padding:5px 8px;color:var(--ink)}
.lg-strip input[type=date]{font:inherit;font-size:12px;background:var(--input);border:0;border-radius:8px;padding:5px 8px;color:var(--ink)}

/* VDOT (Daniels and Gilbert) */
const vo2=v=>-4.60+0.182258*v+0.000104*v*v;
const pct=t=>0.8+0.1894393*Math.exp(-0.012778*t)+0.2989558*Math.exp(-0.1932605*t);
const vdotFrom=(d,sec)=>{const t=sec/60;return vo2(d/t)/pct(t);};
function predict(v,d){let lo=1,hi=900;for(let i=0;i<70;i++){const m=(lo+hi)/2;if(vdotFrom(d,m*60)>v)lo=m;else hi=m;}return (lo+hi)/2*60;}
function paceF(f,v){const a=.000104,b=.182258,c=4.6+f*v;return 60000/((-b+Math.sqrt(b*b+4*a*c))/(2*a));}
function goalVdot(){const g=pDur(S.settings.goalMarathon)||10620;let lo=30,hi=85;for(let i=0;i<50;i++){const m=(lo+hi)/2;if(predict(m,42195)>g)lo=m;else hi=m;}return (lo+hi)/2;}

/* Zones: pace from VDOT, heart rate from LTHR if set */
function ZONES(){
  const v=+S.settings.vdot||52, gm=(pDur(S.settings.goalMarathon)||10620)/42.195, L=+S.settings.lthr||0;
  const hr=(a,b)=>L?(a?Math.round(L*a):"")+(a&&b?" to ":"")+(b?Math.round(L*b):"")+(!a?"under ":"")+" bpm":"";
  const eF=paceF(.70,v), eS=paceF(.62,v), T=paceF(.88,v), I=paceF(.98,v), R=paceF(1.07,v), M=predict(v,42195)/42.195;
  return [
    {k:"rec",n:"Recovery",slow:9999,fast:eS,txt:"slower than "+fP(eS),hr:L?"under "+Math.round(L*.81)+" bpm":"",use:"Shakeouts and the day after hard work."},
    {k:"st",n:"Steady aerobic",slow:eS,fast:eF,txt:fP(eF)+" to "+fP(eS),hr:L?Math.round(L*.81)+" to "+Math.round(L*.89)+" bpm":"",use:"Most of your running. Full sentences."},
    {k:"mp",n:"Marathon pace",slow:eF,fast:(M+T)/2,txt:fP(gm)+" goal · "+fP(M)+" fitness",hr:L?Math.round(L*.90)+" to "+Math.round(L*.94)+" bpm":"",use:"Race rhythm. Controlled, a few words at a time."},
    {k:"lt2",n:"Threshold",slow:(M+T)/2,fast:(T+I)/2,txt:fP(T)+" (±5s)",hr:L?Math.round(L*.95)+" to "+Math.round(L*1.0)+" bpm":"",use:"Hardest pace you could hold about an hour."},
    {k:"vo2",n:"VO2 intervals",slow:(T+I)/2,fast:(I+R)/2,txt:fP(I),hr:L?"over "+Math.round(L*1.0)+" bpm":"",use:"3km to 5km race effort in reps."},
    {k:"sp",n:"Speed",slow:(I+R)/2,fast:0,txt:fP(R)+" or faster",hr:"",use:"Strides, 200s and 400s. Fast and relaxed."}
  ];
}
const zoneByKey=k=>ZONES().find(z=>z.k===k);
function zoneOfPace(spk){const Z=ZONES();for(const z of Z){if(spk<=z.slow&&spk>z.fast)return z.k;}return spk>Z[0].fast?"rec":"sp";}
function zoneText(k){const z=ZONES(),v=+S.settings.vdot||52;const gm=(pDur(S.settings.goalMarathon)||10620)/42.195;
  return k==="E"?fP(paceF(.70,v))+" to "+fP(paceF(.62,v))+"/km":k==="GMP"?fP(gm)+"/km":k==="M"?fP(predict(v,42195)/42.195)+"/km":k==="T"?fP(paceF(.88,v))+"/km":k==="I"?fP(paceF(.98,v))+"/km":fP(paceF(1.07,v))+"/km";}
const ZK={E:"st",GMP:"mp",M:"mp",T:"lt2",I:"vo2",R:"sp"};
const fill=t=>esc(t).replace(/\{(E|M|T|I|R|GMP)\}/g,(m,k)=>'<span class="pace z-'+ZK[k]+'">'+zoneText(k)+'</span>');

/* Session kind to zone */
const KZ={easy:"st",recovery:"rec",long:"st",marathon:"mp",threshold:"lt2",quality:"vo2",race:"race",rest:"x",cross:"x",strength:"x"};
function sessZone(d){if(d.kind==="long"&&/\{GMP\}/.test(d.detail||""))return "mp";if(d.kind==="quality"&&/\{R\}/.test(d.detail||""))return "sp";return KZ[d.kind]||"x";}
const KLABEL={easy:"Steady aerobic",recovery:"Recovery",long:"Long run",marathon:"Marathon pace",threshold:"Threshold",quality:"VO2 / speed",race:"Race",rest:"Rest",cross:"Cross-train",strength:"Strength"};
function plannedDose(d){ // km per zone, estimated
  const km=+d.km||0, out={}; if(!km)return out; const add=(k,x)=>out[k]=(out[k]||0)+x;
  const det=d.detail||""; const mp=[...det.matchAll(/(\d+)km at \{GMP\}/g)].reduce((a,m)=>a+ +m[1],0);
  if(d.kind==="easy")add("st",km);else if(d.kind==="recovery")add("rec",km);
  else if(d.kind==="long"||d.kind==="marathon"){const m=Math.min(mp||(d.kind==="marathon"?km*.7:0),km);add("mp",m);add("st",km-m);}
  else if(d.kind==="threshold"){add("lt2",km*.5);add("st",km*.5);}
  else if(d.kind==="quality"){const z=/\{R\}/.test(det)?"sp":"vo2";add(z,km*.3);add("st",km*.7);}
  else if(d.kind==="race"){const z=km>30?"mp":km>15?"lt2":"vo2";const r=km>30?km:km>15?21.1:km>12?10:5;add(z,r);add("st",Math.max(0,km-r));}
  return out;
}

/* Plan index */
const weekList=()=>Object.values(S.weeks).sort((a,b)=>a.n-b.n);
function dayIndex(){const m={};for(const w of weekList())for(const d of(w.days||[]))m[d.date]={w,d};return m;}
function weekOf(date){let c=null;for(const w of weekList()){const e=addD(w.start,(w.days||[]).length-1);if(date>=w.start&&date<=e)c=w;}return c;}
const isRun=r=>r.sport?r.sport==="run":(!r.type||/run/i.test(r.type));
const runsOn=date=>Object.values(S.runs).filter(r=>r.date===date&&isRun(r));
const otherOn=date=>Object.values(S.runs).filter(r=>r.date===date&&!isRun(r));
const kmOn=date=>runsOn(date).reduce((a,r)=>a+(+r.km||0),0);
function status(d){const lg=S.log[d.date]||{},km=kmOn(d.date);
  if(!(+d.km))return (lg.done||lg.gymDone||otherOn(d.date).length)?"done":"rest";
  if(lg.done||km>0){if(km>0&&km<d.km*.75&&!lg.done)return "part";return "done";}
  if(d.date<TODAY)return "miss";return "todo";}
const wPlan=w=>(w.days||[]).reduce((a,d)=>a+(+d.km||0),0);
const wAct=w=>(w.days||[]).reduce((a,d)=>a+kmOn(d.date),0);

/* Coach read for a day */
function coachRead(d){
  const rs=runsOn(d.date), lg=S.log[d.date]||{}, km=rs.reduce((a,r)=>a+(+r.km||0),0);
  if(!rs.length&&!lg.done)return null;
  const notes=[]; let tone="good";
  const sec=rs.reduce((a,r)=>a+(+r.sec||0),0), pace=km?sec/km:0;
  const hrs=rs.filter(r=>r.avgHr), hr=hrs.length?hrs.reduce((a,r)=>a+r.avgHr*r.sec,0)/hrs.reduce((a,r)=>a+r.sec,0):0;
  const Z=ZONES(), st=Z[1], L=+S.settings.lthr||0;
  if(+d.km&&km){const r=km/d.km; if(r<.85){notes.push("Ran "+km.toFixed(1)+" of "+d.km+" km planned.");tone="warn";} else if(r>1.15){notes.push(km.toFixed(1)+" km is well over the "+d.km+" planned. Extra volume on easy days still costs recovery.");tone="warn";} else notes.push("Distance on plan.");}
  else if(km) notes.push(km.toFixed(1)+" km logged.");
  if(pace&&(d.kind==="easy"||d.kind==="recovery"||(d.kind==="long"&&!/\{GMP\}/.test(d.detail||"")))){
    if(pace<st.fast-6){notes.push("Average "+fP(pace)+"/km is quicker than steady ("+fP(st.fast)+" or slower). Easy days only work if they stay easy.");tone="warn";}
    else notes.push("Pace "+fP(pace)+"/km sat in steady aerobic. Exactly right.");
  } else if(pace&&(d.kind==="threshold"||d.kind==="quality"))notes.push("Average "+fP(pace)+"/km includes warm up and recoveries, so judge the reps from your laps.");
  else if(pace&&(d.kind==="long"||d.kind==="marathon"))notes.push("Average "+fP(pace)+"/km across the whole run.");
  if(hr&&L&&(d.kind==="easy"||d.kind==="recovery")&&hr>L*.89){notes.push("Average pulse "+Math.round(hr)+" bpm is above your steady ceiling of "+Math.round(L*.89)+".");tone="warn";}
  if(lg.rpe&&(d.kind==="easy"||d.kind==="recovery")&&lg.rpe>=6){notes.push("Effort "+lg.rpe+"/10 on an easy day. Check sleep, fuel and heat.");tone="warn";}
  if(lg.rpe&&(d.kind==="threshold")&&lg.rpe>=9){notes.push("Threshold should feel 7 to 8 out of 10. A 9 says the pace is too hot or you were tired.");tone="warn";}
  (lg.niggles||[]).filter(n=>+n.score>=4).forEach(n=>{notes.push(n.area+" ("+n.side.toLowerCase()+") at "+n.score+"/10. Ease off and keep logging it.");tone="bad";});
  if(lg.foot!=null&&lg.foot>=4){notes.push("Foot pain "+lg.foot+"/10. Drop back a step for 2 to 3 days and let me know.");tone="bad";}
  else if(lg.foot!=null&&lg.foot>0)notes.push("Foot "+lg.foot+"/10, inside the limit.");
  return {tone,text:notes.join(" ")};
}

/* Charts */
function weekBars(w,dark){
  const days=(w.days||[]).length>7?w.days.slice(dayPos(w)):w.days;
  const anyKm=days.some(d=>(+d.km||0)>0||kmOn(d.date)>0);
  const W=330,H=anyKm?164:62,T=anyKm?16:4,B=40; const max=Math.max(10,...days.map(d=>Math.max(+d.km||0,kmOn(d.date))))*1.1;
  const bw=W/7, y=v=>T+(H-T-B)*(1-v/max);
  let g="";
  days.forEach((d,i)=>{const x=i*bw+6,w2=bw-12,pk=+d.km||0,ak=kmOn(d.date),z=sessZone(d),st=status(d);
    const col=z==="x"?"var(--z-x)":"var(--z-"+(z==="race"?"lt2":z)+")";
    if(pk)g+='<rect x="'+x+'" y="'+y(pk)+'" width="'+w2+'" height="'+(y(0)-y(pk))+'" rx="3" fill="'+col+'" opacity="'+(st==="done"?.25:.9)+'"/>';
    else g+='<rect x="'+x+'" y="'+(y(0)-2)+'" width="'+w2+'" height="2" rx="1" fill="'+(dark?"var(--on3)":"var(--line2)")+'"/>';
    if(ak)g+='<rect x="'+x+'" y="'+y(ak)+'" width="'+w2+'" height="'+(y(0)-y(ak))+'" rx="3" fill="'+(dark?"var(--on)":"var(--ink)")+'"/>';
    const lab=ak?ak.toFixed(1):pk?String(pk):"";
    if(lab)g+='<text x="'+(x+w2/2)+'" y="'+(y(Math.max(pk,ak))-5)+'" text-anchor="middle">'+lab+'</text>';
    const ks=daySports(d.date); const n=ks.length, dw=7, gap=3, x0=x+w2/2-(n*dw+(n-1)*gap)/2;
    ks.forEach((k,j)=>g+='<rect x="'+(x0+j*(dw+gap))+'" y="'+(y(0)+7)+'" width="'+dw+'" height="'+dw+'" rx="2" fill="'+SPORT_COL[k]+'"/>');
    g+='<text x="'+(x+w2/2)+'" y="'+(H-8)+'" text-anchor="middle" style="'+(d.date===TODAY?"fill:var(--accent);font-weight:600":"")+'">'+d.dow.slice(0,1)+'</text>';
    g+='<rect data-wkday="'+d.date+'" x="'+(i*bw)+'" y="0" width="'+bw+'" height="'+H+'" fill="transparent" style="cursor:pointer"/>';
  });
  return '<svg class="bars" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Distance by day this week, with other sessions marked below. Tap a day for detail.">'+g+'</svg>';
}
function dayPos(w){const i=w.days.findIndex(d=>d.date===(UI.sel||TODAY));return i<0?0:Math.floor(i/7)*7;}

function doseChart(){
  const ws=weekList(); if(!ws.length)return "";
  const W=640,H=230,L=30,R=8,T=14,B=24, order=["rec","st","mp","lt2","vo2","sp"];
  const data=ws.map(w=>{const o={};(w.days||[]).forEach(d=>{const p=plannedDose(d);for(const k in p)o[k]=(o[k]||0)+p[k];});return o;});
  const max=Math.ceil(Math.max(...ws.map(wPlan))/25)*25+10;
  const bw=(W-L-R)/ws.length, y=v=>T+(H-T-B)*(1-v/max);
  const cur=weekOf(TODAY); let g='<defs><pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="2.2" height="5" fill="var(--dark)" opacity=".55"/></pattern></defs>';
  for(let t=25;t<max;t+=25)g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(t)+'" y2="'+y(t)+'" stroke="var(--dline)"/><text x="'+(L-6)+'" y="'+(y(t)+3)+'" text-anchor="end">'+t+'</text>';
  ws.forEach((w,i)=>{const x=L+i*bw+1.5,wd=bw-3;let acc=0;
    order.forEach(k=>{const v=data[i][k]||0;if(!v)return;g+='<rect x="'+x+'" y="'+y(acc+v)+'" width="'+wd+'" height="'+(y(acc)-y(acc+v))+'" fill="var(--z-'+k+')"/>';acc+=v;});
    const future=cur?w.n>cur.n:w.start>TODAY;
    if(future&&acc)g+='<rect x="'+x+'" y="'+y(acc)+'" width="'+wd+'" height="'+(y(0)-y(acc))+'" fill="url(#hatch)"/>';
    const a=wAct(w); if(a)g+='<line x1="'+x+'" x2="'+(x+wd)+'" y1="'+y(a)+'" y2="'+y(a)+'" stroke="var(--on)" stroke-width="2"/>';
    if(w.n%4===1||w.n===25)g+='<text x="'+(x+wd/2)+'" y="'+(H-8)+'" text-anchor="middle">W'+w.n+'</text>';
    if(cur&&cur.n===w.n){g+='<line x1="'+(x+wd/2)+'" x2="'+(x+wd/2)+'" y1="'+T+'" y2="'+(H-B)+'" stroke="var(--accent)" stroke-dasharray="3 3"/><text x="'+(x+wd/2+4)+'" y="'+(T+6)+'" style="fill:var(--accent)">TODAY</text>';}
  });
  return '<svg class="bars" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Weekly planned kilometres by zone">'+g+'</svg>'+
    '<div class="legend">'+[["rec","Recovery"],["st","Steady"],["mp","Marathon"],["lt2","Threshold"],["vo2","VO2"],["sp","Speed"]].map(z=>'<span class="z-'+z[0]+'"><i></i>'+z[1]+'</span>').join("")+'<span><i style="background:var(--on)"></i>Completed</span></div>';
}

function recipe(weeks){
  const end=TODAY, start=addD(TODAY,-7*weeks+1); const mins={};
  Object.values(S.runs).filter(r=>isRun(r)&&r.date>=start&&r.date<=end&&r.km>0).forEach(r=>{const z=zoneOfPace(r.sec/r.km);mins[z]=(mins[z]||0)+r.sec/60;});
  const Z=ZONES(); const per=k=>(mins[k]||0)/weeks; const max=Math.max(30,...Z.map(z=>per(z.k)));
  return '<div class="rec">'+Z.map(z=>'<div class="rec-r z-'+z.k+'"><div class="n">'+z.n+'</div><div class="d">'+esc(z.txt)+(z.hr?' · '+esc(z.hr):'')+'</div><div class="v">'+Math.round(per(z.k))+'<small>MIN/WK</small></div><div class="bar"><div style="width:'+(per(z.k)/max*100)+'%"></div></div></div>').join("")+'</div>';
}

function lineChart(points,opts){ // points [{x:date,y:secPerKm}] faster is up
  const W=320,H=160,L=36,R=10,T=12,B=22;
  if(points.length<2)return '<div class="empty">'+esc(opts.empty)+'</div>';
  const xs=points.map(p=>pISO(p.x).getTime()), ys=points.map(p=>p.y).concat(opts.goal?[opts.goal]:[]);
  const x0=Math.min(...xs),x1=Math.max(...xs)||x0+1, yMin=Math.min(...ys)-5, yMax=Math.max(...ys)+5;
  const X=t=>L+(W-L-R)*(x1===x0?.5:(t-x0)/(x1-x0)), Y=v=>T+(H-T-B)*((v-yMin)/(yMax-yMin));
  let g="";[yMin+5,(yMin+yMax)/2,yMax-5].forEach(v=>g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="'+(opts.dark?"var(--dline)":"var(--line)")+'"/><text x="'+(L-5)+'" y="'+(Y(v)+3)+'" text-anchor="end">'+fP(v)+'</text>');
  if(opts.goal)g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(opts.goal)+'" y2="'+Y(opts.goal)+'" stroke="var(--accent)" stroke-dasharray="4 4"/><text x="'+(W-R)+'" y="'+(Y(opts.goal)-4)+'" text-anchor="end" style="fill:var(--accent)">GOAL '+fP(opts.goal)+'</text>';
  const d=points.map((p,i)=>(i?"L":"M")+X(xs[i]).toFixed(1)+" "+Y(p.y).toFixed(1)).join(" ");
  g+='<path d="'+d+'" fill="none" stroke="'+(opts.dark?"var(--on)":"var(--accent)")+'" stroke-width="2" stroke-linejoin="round"/>';
  points.forEach((p,i)=>g+='<circle cx="'+X(xs[i])+'" cy="'+Y(p.y)+'" r="'+(i===points.length-1?4:2.5)+'" fill="'+(opts.dark?"var(--on)":"var(--accent)")+'"/>');
  g+='<text x="'+L+'" y="'+(H-6)+'">'+fD(points[0].x)+'</text><text x="'+(W-R)+'" y="'+(H-6)+'" text-anchor="end">'+fD(points[points.length-1].x)+'</text>';
  return '<svg class="bars" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(opts.label)+'">'+g+'</svg>';
}

/* Views */
function head(eb,title,lede){return '<div class="head"><div class="eb acc">'+eb+'</div><h1>'+esc(title)+'</h1>'+(lede?'<div class="lede">'+esc(lede)+'</div>':'')+'</div>';}
function dayRow(d,dark){
  const st=(d.kind==="rest"&&!(+d.km))?"rest":status(d), z=sessZone(d), dd=pISO(d.date), km=kmOn(d.date);
  const s=st==="done"?'<span class="ok">Completed</span>'+(km?' · '+km.toFixed(1)+' km':''):st==="miss"?'<span class="miss">Missed</span>':st==="part"?'<span class="part">Partial</span> · '+km.toFixed(1)+' of '+d.km+' km':d.km?'Planned · '+d.km+' km':KLABEL[d.kind]||"";

}

    '<div class="sess-t">'+esc(d.title)+'</div>'+
    '<div class="sess-m">'+(d.km?d.km+' km':'No running')+(zone&&d.km?' · '+esc(zone.txt)+(zone.hr?' · '+esc(zone.hr):''):'')+(w?' · W'+w.n+' '+esc(w.phase):'')+'</div>'+

}

function doneCard(d){
  const rs=Object.values(S.runs).filter(r=>r.date===d.date&&isRun(r)), km=rs.reduce((a,r)=>a+(+r.km||0),0), sec=rs.reduce((a,r)=>a+(+r.sec||0),0);
  const hr=rs.length?Math.round(rs.reduce((a,r)=>a+(+r.avgHr||0)*(+r.sec||0),0)/Math.max(1,sec)):0; const a=rs[0]?analyseRun(rs[0],d):null;
  const others=Object.values(S.runs).filter(r=>r.date===d.date&&!isRun(r));
  return '<section class="card pad donecard"><div class="ch"><span class="eb">Today · '+fD(d.date,true)+'</span><span class="donetag">Done ✓</span></div>'+
    '<div class="done-t">'+esc(d.title)+(a&&a.tone?' <span class="vchip tone-'+a.tone+'">'+esc(a.head)+'</span>':'')+'</div>'+
    (km?'<div class="done-m mono"><span><b>'+km.toFixed(1)+'</b> km</span><span><b>'+fP(sec/km)+'</b> /km</span>'+(hr?'<span><b>'+hr+'</b> bpm</span>':'')+'<span><b>'+fHM(sec)+'</b>'+(rs[0]&&+rs[0].el>sec+29?' <small>('+fHM(+rs[0].el)+' elapsed)</small>':'')+'</span></div>':'')+
    (others.length?'<div class="sub" style="margin-top:6px">Also: '+others.map(o=>esc(SPORT_LBL[sportKind(o)]||o.type)+' '+fHM(o.sec)).join(", ")+'</div>':'')+
    '<button class="linkrow" type="button" data-day="'+d.date+'"><span>Session details</span><span aria-hidden="true">›</span></button></section>';}
function vToday(){
  const ws=weekList(); if(!ws.length)return head("Today","Today")+'<div class="card pad"><div class="empty">'+(S.loaded?"No plan loaded yet.":"Loading your plan")+'</div></div>';

    heroDate=nx?nx.date:null;hero=doneCard(d)+(nx?sessionCard(nx,weekOf(nx.date),nx.date===addD(TODAY,1)?"Tomorrow":"Next up"):"");}
  h+='<div class="cols two"><div class="stack">'+hero;

    (runWeek?'<div class="m"><div class="k">Key sessions</div><div class="v">'+qd+'<small>/ '+qual.length+'</small></div></div>':'')+

/* Training load: TSS per activity, then fitness (CTL 42d), fatigue (ATL 7d), form (TSB) */
const SPORT_COL={run:"var(--z-lt2)",bike:"var(--z-st)",swim:"var(--z-rec)",gym:"var(--z-sp)",other:"var(--z-x)"};
const SPORT_LBL={run:"Run",bike:"Ride",swim:"Swim",gym:"Gym",other:"Other"};
function sportKind(a){const t=String(a.type||"")+" "+String(a.title||"");
  if(isRun(a)||/run/i.test(a.type||""))return "run"; if(/ride|cycl|bike|velo/i.test(t))return "bike"; if(/swim/i.test(t))return "swim";
  if(/weight|strength|workout|training|crossfit|fitness|stair|gym|yoga|pilates/i.test(t))return "gym"; return "other";}
function tssOf(a){
  const h=(+a.sec||0)/3600, L=+S.settings.lthr||167; if(!(h>0))return 0;
  const k=sportKind(a);
  if(/meditat|breath/i.test(String(a.type||"")+String(a.title||"")))return 0;
  const ifHr=off=>a.avgHr?Math.min(1.15,a.avgHr/(L-off)):null;
  let IF;
  if(k==="run"){IF=ifHr(0); if(IF==null&&a.km>0){const T=paceF(.88,+S.settings.vdot||52);IF=Math.min(1.15,T/((+a.sec)/(+a.km)));} if(IF==null)IF=.75;}
  else if(k==="bike")IF=ifHr(7)??.65;
  else if(k==="swim")IF=ifHr(12)??.70;
  else if(k==="gym")IF=a.avgHr?Math.min(.85,a.avgHr/L):.55;
  else IF=/walk|hike/i.test(String(a.type||"")+String(a.title||""))?Math.min(.55,ifHr(0)??.5):(ifHr(0)??.55);
  return h*IF*IF*100;
}
function dailyLoad(){
  const d={};const add=(date,k,v)=>{if(!v)return;(d[date]=d[date]||{t:0,by:{}});d[date].t+=v;d[date].by[k]=(d[date].by[k]||0)+v;};
  Object.values(S.runs).forEach(a=>add(a.date,sportKind(a),tssOf(a)));
  Object.values(S.log).forEach(l=>{ // manual entries only when nothing synced that day for that kind
    const syn=Object.values(S.runs).filter(r=>r.date===l.date);

function loadRead(all,now,dC){

async function sendChat(text){
  if(!text)return; if(!S.db){toast("Chat is unavailable right now");return;}
  const ts=new Date(); const stamp=iso(ts)+"T"+p2(ts.getHours())+":"+p2(ts.getMinutes())+":"+p2(ts.getSeconds());
  const id=stamp.replace(/[^0-9]/g,"")+"-u";
  const st=$("#chatState"); const inp=$("#chatIn"); if(inp)inp.value="";
  try{await S.db.collection("chat").doc(id).set({ts:stamp,role:"user",text,via:"dashboard",handled:false});}catch(e){toast("Couldn't send. Try again.");return;}
  const sample=async(turns)=>{const {data,error}=await SB.functions.invoke("coach",{body:{turns}});if(error){let code="error";try{const b=await error.context.json();code=b.code||code;}catch(_){}throw {code};}return {text:data.text};};
  if(st)st.textContent="Coach is thinking";

  if(!turns.length||turns[turns.length-1].content!==text)turns.push({role:"user",content:text});
  while(turns.length&&turns[0].role!=="user")turns.shift();
  const brief="You are James's running coach, texting him like a good human coach would: direct, warm, specific, Australian English, short (2 to 6 sentences unless he asks for detail). Never use em dashes or en dashes. Ground every answer in the data below and in sports science. Be conservative with injury: never clear him to run on the foot; send red flags (heat, spreading redness, fever, cannot bear weight) to same-day medical care. If his message implies a plan change (missed sessions, illness, niggle, travel, schedule), say what you would change and end with a line starting PLAN CHANGE: summarising it, so it can be built into the plan. Ask at most one question.\n\n"+coachContext()+"\n\nConversation follows. Reply to his latest message.";
  turns[0]={role:"user",content:brief+"\n\nJames: "+turns[0].content};
  try{const {text:reply}=await sample(turns,{cache:false});
    const t2=new Date(); const s2=iso(t2)+"T"+p2(t2.getHours())+":"+p2(t2.getMinutes())+":"+p2(t2.getSeconds());

    if(st)st.textContent="";
  }catch(e){if(st)st.textContent=e&&e.code==="no_key"?"Coach needs the API key added in Supabase. Your message is saved.":"No reply this time. Your message is saved for the next sync.";}
}

/* ===================== Session check + pace review ===================== */
function goalMP(){return (pDur(S.settings.goalMarathon)||10620)/42.195;}
function targetsFor(d,v){
  v=v||+S.settings.vdot||52; const L=+S.settings.lthr||167;

  const det=d&&d.detail||"", k=d&&d.kind;
  if(!d||!(+d.km)||["rest","cross","strength"].includes(k))return null;
  if(k==="race")return {type:"race"};
  if(k==="threshold"&&!/\{T\}/.test(det)&&/half marathon pace/i.test(det))return {type:"work",name:"Half marathon pace",pace:(T+M)/2,tol:.025,hr:[L*.92,L*.98],ez:[eF,eS],cap:L*.89};
  if(k==="threshold")return {type:"work",name:"Threshold",pace:T,tol:.02,hr:[L*.93,L*1.0],ez:[eF,eS],cap:L*.89};
  if(k==="quality"&&/\{R\}/.test(det))return {type:"work",name:"Speed reps",pace:R,tol:.03,hr:null,ez:[eF,eS],cap:L*.89};
  if(k==="quality"&&/\{I\}/.test(det))return {type:"work",name:"VO2 intervals",pace:I,tol:.025,hr:[L*.97,L*1.06],ez:[eF,eS],cap:L*.89};
  if(k==="quality")return {type:"work",name:"Intervals",pace:(T+I)/2,tol:.03,hr:null,ez:[eF,eS],cap:L*.89};
  if(k==="marathon"||(k==="long"&&/\{GMP\}/.test(det)))return {type:"work",name:"Marathon pace",pace:M,tol:.015,hr:[L*.88,L*.95],ez:[eF,eS],cap:L*.89,long:k==="long"};
  if(k==="recovery")return {type:"easy",name:"Recovery",band:[eS,eS*1.12],cap:L*.81,soft:L*.85};
  return {type:"easy",name:k==="long"?"Long easy":"Easy",band:[eF,eS],cap:L*.89,soft:L*.91,long:k==="long"};
}
function lapsOf(r){return (r.laps||[]).map(l=>({m:+l[0],s:+l[1],hr:+l[2]||0,el:+l[3]||+l[1]})).filter(l=>l.m>=300&&l.s>0);}

function analyseRun(r,d){

  (L.ex||[]).forEach(x=>{const e=EXI[x.id]||{t:"w",p:[],s:[],bw:0,name:x.name};doneSets(x).forEach(st=>{const v=setLoad(e,st,bw);t+=v;sets++;reps+=(e.t==="t"?0:+st.r||0);
    e.p.forEach(m=>{mus[m]=(mus[m]||0)+1;mt[m]=(mt[m]||0)+v;});e.s.forEach(m=>{mus[m]=(mus[m]||0)+.5;mt[m]=(mt[m]||0)+v*.5;});});});
  return {t,sets,reps,mus,mt};}
function e1rm(w,r){r=+r;w=+w;if(!w||!r||r>12)return 0;return r===1?w:w*(1+r/30);}
function fT(kg){return kg>=1000?(kg/1000).toFixed(kg>=10000?1:2)+' t':Math.round(kg)+' kg';}
function fSet(e,st){if(e.t==="t")return (+st.r||0)+'s';if(e.t==="p")return (+st.r||0)+' reps';if(e.t==="b")return (+st.w?'+'+st.w+' kg × ':'BW × ')+(+st.r||0);return (+st.w||0)+' × '+(+st.r||0);}
function lastFor(id,before){const ls=lifts().filter(l=>!before||l.id!==before).reverse();for(const l of ls){const x=(l.ex||[]).find(y=>y.id===id);if(x&&doneSets(x).length)return {l,x};}return null;}
function prsBefore(id,date,sid){let best=0;lifts().forEach(l=>{if(l.id===sid||l.date>date)return;(l.ex||[]).forEach(x=>{if(x.id!==id)return;doneSets(x).forEach(st=>{best=Math.max(best,e1rm(st.w,st.r));});});});return best;}

/* ---- muscle map ---- */

  return '<svg class="bodymap" viewBox="0 0 260 306" role="img" aria-label="Muscles worked, darker means more sets">'+front(4)+back(136)+'</svg>';}
function splitBar(mus){const u=UPPER.reduce((a,m)=>a+(mus[m]||0),0),l=LOWER.reduce((a,m)=>a+(mus[m]||0),0),c=mus.core||0,t=u+l+c||1;
  const seg=(v,cls,lab)=>v?'<i class="'+cls+'" style="width:'+(v/t*100).toFixed(1)+'%"></i>':'';
  return '<div class="ulbar">'+seg(u,"u")+seg(l,"l")+seg(c,"c")+'</div><div class="ullab"><span><i class="u"></i>Upper '+Math.round(u/t*100)+'%</span><span><i class="l"></i>Lower '+Math.round(l/t*100)+'%</span><span><i class="c"></i>Core '+Math.round(c/t*100)+'%</span></div>';}
function muscleRank(mus,mt,n){const ks=Object.keys(mus).sort((a,b)=>mus[b]-mus[a]).slice(0,n||12);const mx=Math.max(1,...ks.map(k=>mus[k]));
  return '<div class="mrank">'+ks.map(k=>'<div class="mr"><span>'+MUSC[k]+'</span><span class="mr-bar"><i style="width:'+(mus[k]/mx*100).toFixed(1)+'%"></i></span><span class="mono">'+(+mus[k]).toFixed(1).replace(/\.0$/,"")+'<small> sets</small></span></div>').join("")+'</div>';}

/* ---- aggregates ---- */
function liftAgg(from,to){const ls=lifts().filter(l=>l.date>=from&&l.date<=to);const mus={},mt={};let t=0,sets=0,reps=0;
  ls.forEach(l=>{const s=sessStats(l);t+=s.t;sets+=s.sets;reps+=s.reps;Object.entries(s.mus).forEach(([k,v])=>mus[k]=(mus[k]||0)+v);Object.entries(s.mt).forEach(([k,v])=>mt[k]=(mt[k]||0)+v);});
  return {ls,t,sets,reps,mus,mt,n:ls.length};}
function gymPeriod(p){if(p==="month")return [addD(TODAY,-27),TODAY];if(p==="year")return [TODAY.slice(0,5)+"01-01",TODAY];return [monOf(TODAY),addD(monOf(TODAY),6)];}
function runRate(){const from=addD(TODAY,-55);const a=liftAgg(from,TODAY);const first=lifts()[0];if(!first)return 0;const days=Math.max(7,Math.min(56,dBetween(first.date,TODAY)+1));return a.t/days*365;}
function weeklyTonnage(n){const out=[];let m=monOf(TODAY);for(let i=n-1;i>=0;i--){const s=addD(m,-7*i);const a=liftAgg(s,addD(s,6));out.push({m:s,t:a.t,n:a.n});}return out;}

/* ---- Gym tab ---- */

    '<div class="gbig">'+fT(A.t)+'</div>'+
    '<div class="metrics"><div class="m"><div class="k">Sessions</div><div class="v">'+A.n+'</div></div><div class="m"><div class="k">Sets</div><div class="v">'+A.sets+'</div></div><div class="m"><div class="k">Reps</div><div class="v">'+A.reps+'</div></div><div class="m"><div class="k">Annual run rate</div><div class="v">'+fT(rr)+'<small>/ yr</small></div></div></div>'+
    '<div class="eb" style="margin-top:16px">Weekly, last 12 weeks</div><div class="wkt">'+wk.map(x=>'<span title="'+fD(x.m)+': '+fT(x.t)+'"><i style="height:'+Math.max(2,x.t/wmx*100).toFixed(1)+'%"'+(x.m===monOf(TODAY)?' class="cur"':'')+'></i></span>').join("")+'</div><div class="wkt-lab"><span>'+fD(wk[0].m)+'</span><span>This week</span></div></section>';
  h+='<section class="card pad"><div class="eb">Sessions</div><h2>Recent</h2><div class="glist">'+ls.slice().reverse().slice(0,8).map(l=>{const s=sessStats(l);const top=Object.keys(s.mus).sort((x,y)=>s.mus[y]-s.mus[x]).slice(0,3).map(k=>MUSC[k]).join(", ");

  h+='</div><div class="stack">';

function bestLifts(){const b={};lifts().forEach(l=>(l.ex||[]).forEach(x=>{const e=EXI[x.id];if(!e||e.t!=="w")return;doneSets(x).forEach(st=>{const v=e1rm(st.w,st.r);if(v&&(!b[x.id]||v>b[x.id].e))b[x.id]={name:e.name,e:v,w:+st.w,r:+st.r,date:l.date};});}));return Object.values(b).sort((a,c)=>c.e-a.e);}
function tplFromPlan(d){const t=(d.extra||"")+" "+(d.title||"");if(/Strength \(return\)|Strength \(light\)/i.test(t)||d.kind==="strength")return "R";if(/^Strength A|Strength A \(/.test(d.extra||"")||/Strength A/.test(d.title||""))return "A";if(/Strength B/.test(t))return "B";if(/maintenance/i.test(t))return "M";return null;}
function liftsOn(date){return lifts().filter(l=>l.date===date);}
function doneCount(L){return (L.ex||[]).reduce((a,x)=>a+(x.sets||[]).filter(s=>s.done).length,0);}

/* ---- session detail ---- */
function openLift(id){

  const mp=gymMatch(L.date).find(p=>p.lift.id===id); const act=mp&&mp.act;
  const mins=act?Math.round(act.sec/60):(+L.min||0);

  x+='<div class="matchnote">'+(act?'Matched to your watch: '+esc(act.title||"Weight training")+' · '+Math.round(act.sec/60)+' min'+(act.avgHr?' · '+Math.round(act.avgHr)+' bpm':'')+'. Counted once.':'No watch session found for this day. Time and load come from what you logged.')+'</div>';
  x+='<section class="card pad" style="margin-top:12px"><div class="eb">Exercises</div>'+(L.ex||[]).filter(xx=>doneSets(xx).length).map(xx=>{const e=EXI[xx.id]||{name:xx.name,t:"w",p:[],s:[],bw:0};const ds=doneSets(xx);
      const best=e.t==="w"?Math.max(0,...ds.map(st=>e1rm(st.w,st.r))):0; const prev=e.t==="w"?prsBefore(xx.id,L.date,id):0; const pr=best&&prev&&best>prev+0.01;

/* ---- logger ---- */
function gymDraft(){try{const d=JSON.parse(localStorage.getItem("mt-gymdraft")||"null");return d&&d.ex?d:null;}catch(e){return null;}}
function saveDraft(L){try{localStorage.setItem("mt-gymdraft",JSON.stringify(L));}catch(e){}}
function clearDraft(){try{localStorage.removeItem("mt-gymdraft");}catch(e){}}
function exFromLast(id,sets,reps){const e=EXI[id];const last=lastFor(id);
  if(last){const ls=doneSets(last.x);return {id,sets:ls.map(s=>({w:+s.w||0,r:+s.r||0,done:false}))};}
  return {id,sets:Array.from({length:sets||3},()=>({w:0,r:reps||(e&&e.t==="t"?30:8),done:false}))};}
function newSession(kind){const now=new Date();const st=p2(now.getHours())+":"+p2(now.getMinutes());
  let L={date:TODAY,start:st,name:"Gym session",ex:[],t0:Date.now()};
  if(TEMPLATES[kind]){L.name=TEMPLATES[kind].name;L.tpl=kind;L.ex=TEMPLATES[kind].ex.map(([id,s,r])=>exFromLast(id,s,r));}
  else if(kind==="last"||String(kind).startsWith("copy:")){const l=kind==="last"?lifts()[lifts().length-1]:(S.lifts||{})[kind.slice(5)];if(l){L.name=l.name||"Gym session";L.tpl=l.tpl||"";L.ex=(l.ex||[]).map(x=>({id:x.id,sets:(x.sets||[]).filter(st=>st.done!==false).map(st=>({w:+st.w||0,r:+st.r||0,done:false}))}));}}
  return L;}
function parseQuick(txt){ // "squat 3x5 100, rdl 3x8@60; plank 3x40s"
  return txt.split(/[,;\n]+/).map(s=>s.trim()).filter(Boolean).map(s=>{
    let m=s.match(/(\d+)\s*[x×]\s*(\d+)\s*(s|sec)?/i); const sets=m?+m[1]:1, reps=m?+m[2]:+((s.match(/\b(\d+)\s*reps?\b/i)||[])[1]||8);
    let rest=m?s.replace(m[0]," "):s; const wm=rest.match(/@?\s*(\d+(?:\.\d+)?)\s*(kg)?/i); const w=wm?+wm[1]:0; if(wm)rest=rest.replace(wm[0]," ");
    const q=rest.toLowerCase().replace(/[^a-z ]/g," ").trim(); if(!q)return null;
    let best=null,bs=0; EX.forEach(e=>{let sc=0;q.split(/\s+/).forEach(t=>{if(t.length<2)return;if(e.k.includes(t))sc+=t.length;});if(e.k.startsWith(q))sc+=5;if(sc>bs){bs=sc;best=e;}});
    if(!best)return null; return {id:best.id,sets:Array.from({length:sets},()=>({w,r:reps,done:true}))};}).filter(Boolean);}
function openLogger(L){
  L=L||gymDraft(); if(!L)return; UI.gymL=L; const bw=bodyW();
  const draw=()=>{const s=sessStats({...L,ex:L.ex.map(x=>({...x,sets:x.sets.filter(st=>st.done)}))});
    let x='<div class="lg-top"><button class="btn ghost" type="button" id="lgX">Close</button><input id="lgName" class="lg-name" value="'+esc(L.name)+'" aria-label="Session name"><button class="btn" type="button" id="lgFin">Finish</button></div>';

    x+='<form class="lg-quick" id="lgQ"><input id="lgQi" placeholder="Quick add: squat 3x5 100, plank 3x40s" autocomplete="off" aria-label="Quick add"><button class="btn ghost" type="submit">Add</button></form>';
    x+=L.ex.map((xx,i)=>{const e=EXI[xx.id]||{name:xx.name||xx.id,t:"w",p:[],s:[]};const last=lastFor(xx.id,L.id);
      return '<div class="lg-ex"><div class="lg-exh"><div><b>'+esc(e.name)+'</b><div class="sub">'+e.p.map(m=>MUSC[m]).join(", ")+(last?' · last '+doneSets(last.x).map(st=>fSet(e,st)).slice(0,3).join(", "):'')+'</div></div><button type="button" class="lg-rm" data-rmex="'+i+'" aria-label="Remove exercise">×</button></div>'+
        '<div class="lg-hdr"><span>Set</span><span>'+(e.t==="t"?"":e.t==="b"?"+kg":"kg")+'</span><span>'+(e.t==="t"?"Seconds":"Reps")+'</span><span></span></div>'+
        xx.sets.map((st,j)=>'<div class="lg-set'+(st.done?' done':'')+'"><span class="mono">'+(j+1)+'</span>'+
          (e.t==="t"||e.t==="p"?'<span></span>':'<span class="stp"><button type="button" data-st="'+i+','+j+',w,-2.5" aria-label="Less weight">−</button><input inputmode="decimal" data-in="'+i+','+j+',w" value="'+(st.w||0)+'" aria-label="Weight"><button type="button" data-st="'+i+','+j+',w,2.5" aria-label="More weight">+</button></span>')+
          '<span class="stp"><button type="button" data-st="'+i+','+j+',r,-1" aria-label="Fewer">−</button><input inputmode="numeric" data-in="'+i+','+j+',r" value="'+(st.r||0)+'" aria-label="Reps"><button type="button" data-st="'+i+','+j+',r,1" aria-label="More">+</button></span>'+
          '<button type="button" class="tick" data-tick="'+i+','+j+'" aria-pressed="'+!!st.done+'" aria-label="Set done">✓</button></div>').join("")+
        '<div class="lg-foot"><button type="button" class="lg-add" data-addset="'+i+'">+ Add set</button><button type="button" class="lg-add" data-tickall="'+i+'">'+(xx.sets.every(st=>st.done)?'Untick all':'Tick all')+'</button></div></div>';}).join("");
    x+='<button type="button" class="btn ghost block" id="lgPick" style="margin-top:12px">+ Add exercise</button><div id="lgPicker"></div>';
    x+='<div class="field" style="margin-top:12px"><label for="lgNote">Notes</label><textarea id="lgNote" placeholder="How it felt, anything to remember">'+esc(L.note||"")+'</textarea></div>';
    x+='<button type="button" class="btn ghost block" id="lgDiscard" style="margin-top:12px;color:var(--bad)">'+(L.id?"Discard changes":"Discard session")+'</button>';
    const prev=document.querySelector(".sheet.lg"), sy=prev?prev.scrollTop:0, fo=document.activeElement&&document.activeElement.dataset?document.activeElement.dataset.in:null;
    $("#sheetRoot").innerHTML='<div class="scrim" id="scrim"><div class="sheet lg" role="dialog" aria-modal="true" aria-label="Log gym session">'+x+'<div id="lgRest" class="lg-rest" hidden></div></div></div>';
    const nw=document.querySelector(".sheet.lg"); if(nw){nw.scrollTop=sy;}
    bindL();};
  const keep=()=>{saveDraft(L);};
  let restT=null, restEnd=0;
  const restTick=()=>{const r=$("#lgRest");if(!r){if(!document.querySelector(".sheet.lg"))clearInterval(restT);return;}
    if(!restEnd){r.hidden=true;return;}const left=Math.ceil((restEnd-Date.now())/1000);r.hidden=false;
    if(left<=0){r.innerHTML='<b>Go</b>';if(left===0){try{navigator.vibrate&&navigator.vibrate(200);}catch(e){}}if(left<-3){restEnd=0;r.hidden=true;}return;}
    r.innerHTML='Rest <b>'+Math.floor(left/60)+':'+p2(left%60)+'</b><button type="button" id="lgRestX">Skip</button>';const x=$("#lgRestX");if(x)x.onclick=()=>{restEnd=0;r.hidden=true;};};
  const rest=sec=>{restEnd=Date.now()+sec*1000;clearInterval(restT);restT=setInterval(restTick,500);restTick();};
  const clock=()=>{const c=$("#lgMin");if(!c){clearInterval(UI.gymClk);return;}if(!L.t0||L.id)return;c.placeholder=Math.floor((Date.now()-L.t0)/60000);};
  clearInterval(UI.gymClk);UI.gymClk=setInterval(clock,15000);
  function bindL(){clock();restTick();
    $("#lgX").onclick=()=>{keep();closeSheet();render();};
    $("#lgName").oninput=e=>{L.name=e.target.value;keep();};
    $("#lgDate").onchange=e=>{L.date=e.target.value||TODAY;keep();};
    $("#lgTime").onchange=e=>{L.start=e.target.value||L.start;keep();};
    $("#lgMin").onchange=e=>{const v=parseInt(e.target.value,10);if(v>0){L.min=v;L.minSet=true;}else{L.minSet=false;}keep();};
    $("#lgDiscard").onclick=e=>{const b=e.currentTarget;if(b.dataset.c!=="1"){b.dataset.c="1";b.textContent=L.id?"Tap again to drop changes":"Tap again to discard";setTimeout(()=>{if(b.isConnected){b.dataset.c="";b.textContent=L.id?"Discard changes":"Discard session";}},3000);return;}
      clearDraft();clearInterval(UI.gymClk);closeSheet();toast(L.id?"Changes dropped":"Session discarded");render();};
    $("#lgNote").oninput=e=>{L.note=e.target.value;keep();};
    document.querySelectorAll("#sheetRoot [data-in]").forEach(inp=>inp.onchange=()=>{const [i,j,k]=inp.dataset.in.split(",");L.ex[+i].sets[+j][k]=+inp.value||0;keep();draw();});
    document.querySelectorAll("#sheetRoot [data-st]").forEach(b=>b.onclick=()=>{const [i,j,k,d]=b.dataset.st.split(",");const st=L.ex[+i].sets[+j];st[k]=Math.max(0,Math.round(((+st[k]||0)+(+d))*10)/10);keep();draw();});
    document.querySelectorAll("#sheetRoot [data-tick]").forEach(b=>b.onclick=()=>{const [i,j]=b.dataset.tick.split(",").map(Number);const st=L.ex[i].sets[j];st.done=!st.done;
      if(st.done){const nx=L.ex[i].sets[j+1];if(nx&&!nx.done&&!(+nx.w)&&+st.w)nx.w=st.w; const e=EXI[L.ex[i].id]; keep();draw();rest(e&&(e.t==="p"||e.t==="t")?45:(e&&LOWER.some(m=>e.p.includes(m))&&e.t==="w"&&(+st.w>=60)?150:90));}else{keep();draw();}});
    document.querySelectorAll("#sheetRoot [data-addset]").forEach(b=>b.onclick=()=>{const xx=L.ex[+b.dataset.addset];const ls=xx.sets[xx.sets.length-1]||{w:0,r:8};xx.sets.push({w:ls.w,r:ls.r,done:false});keep();draw();});
    document.querySelectorAll("#sheetRoot [data-tickall]").forEach(b=>b.onclick=()=>{const xx=L.ex[+b.dataset.tickall];const v=!xx.sets.every(st=>st.done);xx.sets.forEach(st=>st.done=v);keep();draw();});
    document.querySelectorAll("#sheetRoot [data-rmex]").forEach(b=>b.onclick=()=>{L.ex.splice(+b.dataset.rmex,1);keep();draw();});
    $("#lgQ").onsubmit=e=>{e.preventDefault();const add=parseQuick($("#lgQi").value);if(!add.length){toast("Couldn't match that. Try: squat 3x5 100");return;}add.forEach(a=>{const ex=L.ex.find(x=>x.id===a.id&&!x.sets.some(s=>s.done));if(ex)ex.sets=a.sets;else L.ex.push(a);});keep();draw();toast("Added "+add.map(a=>EXI[a.id].name).join(", "));};
    $("#lgPick").onclick=()=>{const p=$("#lgPicker");const recent=[...new Set(lifts().slice().reverse().flatMap(l=>(l.ex||[]).map(x=>x.id)))].slice(0,8);
      const list=q=>{q=(q||"").toLowerCase().trim();const items=q?EX.filter(e=>e.k.includes(q)||e.p.some(m=>m.startsWith(q))):recent.map(id=>EXI[id]).filter(Boolean).concat(EX.filter(e=>!recent.includes(e.id)));
        return items.slice(0,40).map(e=>'<button type="button" data-pick="'+e.id+'"><b>'+esc(e.name)+'</b><span>'+e.p.map(m=>MUSC[m]).join(", ")+'</span></button>').join("");};
      p.innerHTML='<input id="lgPq" placeholder="Search exercise or muscle" autocomplete="off"><div class="pick" id="lgPl">'+list("")+'</div>';
      const bp=()=>p.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{L.ex.push(exFromLast(b.dataset.pick,3,8));keep();draw();setTimeout(()=>{const s=document.querySelector(".sheet.lg");s&&s.scrollTo({top:s.scrollHeight,behavior:"smooth"});},30);});
      bp(); const q=$("#lgPq"); q.focus(); q.oninput=()=>{$("#lgPl").innerHTML=list(q.value);bp();};};
    $("#lgFin").onclick=async()=>{const ex=L.ex.map(x=>({id:x.id,sets:x.sets.filter(s=>s.done).map(s=>({w:+s.w||0,r:+s.r||0}))})).filter(x=>x.sets.length);
      if(!ex.length){toast("Tick at least one set first");return;}
      if(!S.db){toast("Saving is unavailable right now");return;}
      const id=L.id||(L.date+"-"+String(L.start||"0000").replace(":",""));
      const mins=L.minSet?+L.min:(L.t0&&!L.id?Math.max(1,Math.round((Date.now()-L.t0)/60000)):(L.min||0));
      const doc={date:L.date,start:L.start||"",name:(L.name||"Gym session").trim(),tpl:L.tpl||"",ex,note:(L.note||"").trim(),bw:+L.bw||bw,min:mins>0&&mins<300?mins:(L.min||0),updated:new Date().toISOString()};
      const b=$("#lgFin");b.disabled=true;b.textContent="Saving";
      try{await S.db.collection("lifts").doc(id).set(doc);
        const lg={...(S.log[L.date]||{}),date:L.date,gymDone:true};await S.db.doc("log/"+L.date).set(lg);
        clearDraft();clearInterval(UI.gymClk);toast("Saved · "+fT(sessStats(doc).t)+" lifted");closeSheet();UI.tab="gym";render();setTimeout(()=>openLift(id),50);}
      catch(err){toast("Couldn't save. Your session is kept on this phone, try again.");b.disabled=false;b.textContent="Finish";}};
  }
  keep(); draw();
}
function gymCtx(){const a=liftAgg(addD(TODAY,-27),TODAY);if(!a.n)return "GYM: none logged in the last 4 weeks";const top=Object.keys(a.mus).sort((x,y)=>a.mus[y]-a.mus[x]).slice(0,4).map(k=>MUSC[k]+" "+a.mus[k].toFixed(1)).join(", ");
  return "GYM last 4 weeks: "+a.n+" sessions, "+fT(a.t)+" lifted, "+a.sets+" sets. Top muscles by sets: "+top+". Last session "+lifts().slice(-1)[0].date+" "+(lifts().slice(-1)[0].name||"");}

/* Shell */
const TABS=[["today","Today"],["plan","Plan"],["fitness","Fitness"],["gym","Gym"],["runs","Runs"],["coach","Coach"]];
function render(){
  const y=scrollY; const v={today:vToday,plan:vPlan,fitness:vFitness,gym:vGym,runs:vRuns,coach:vCoach}[UI.tab]||vToday;
  $("#app").innerHTML=v();
  if(S.db)passwordPrompt();
  $("#nav").innerHTML=TABS.map(t=>'<button type="button" data-tab="'+t[0]+'" aria-current="'+(UI.tab===t[0]?"page":"false")+'">'+t[1]+'</button>').join("");
  $("#raceChip").innerHTML='Ballarat <b>'+Math.max(0,dBetween(TODAY,RACE_DATE))+'d</b>';
  bind($("#app")); scrollTo(0,y);
}
function setTab(t){UI.tab=t;UI.sel=null;try{localStorage.setItem("mt-tab",t);}catch(e){}closeSheet();render();scrollTo(0,0);}
document.addEventListener("click",e=>{const b=e.target.closest("[data-tab]");if(b&&b.tagName==="BUTTON"){setTab(b.dataset.tab);}});
function bind(r){
  r.querySelectorAll("[data-week]").forEach(b=>b.onclick=()=>{const n=+b.dataset.week;UI.openWeek=UI.openWeek===n?-1:n;render();});
  r.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>openDay(b.dataset.day));
  r.querySelectorAll("[data-log]").forEach(b=>b.onclick=()=>openDay(b.dataset.log));
  const cf=$("#chatF",r);
  if(cf){const box=$("#chat",r);box.scrollTop=box.scrollHeight;cf.onsubmit=e=>{e.preventDefault();sendChat($("#chatIn",r).value.trim());};
    $("#chatIn",r).onkeydown=e=>{if(e.key==="Enter"&&(e.metaKey||e.ctrlKey))cf.requestSubmit();};}
  bindDrag(r);
  r.querySelectorAll("[data-applyvdot]").forEach(b=>b.onclick=async()=>{const nv=+b.dataset.applyvdot;const st={...S.settings,vdot:nv,vdotLog:[...(S.settings.vdotLog||[]),{date:TODAY,from:+S.settings.vdot||52,to:nv,by:"you"}]};b.disabled=true;try{await S.db.doc("settings/main").set(st);S.settings=st;toast("Paces updated to VDOT "+nv);render();}catch(e){b.disabled=false;toast("Couldn't save. Try again.");}});
  r.querySelectorAll("[data-gymtpl]").forEach(b=>b.onclick=()=>openLogger(newSession(b.dataset.gymtpl)));
  r.querySelectorAll("[data-liftstart]").forEach(b=>b.onclick=()=>{const d=gymDraft();openLogger(d||newSession(b.dataset.liftstart));});
  r.querySelectorAll("[data-gymresume]").forEach(b=>b.onclick=()=>openLogger());
  r.querySelectorAll("[data-gymp]").forEach(b=>b.onclick=()=>{UI.gymP=b.dataset.gymp;render();});
  r.querySelectorAll("[data-liftopen]").forEach(b=>b.onclick=()=>openLift(b.dataset.liftopen));
  r.querySelectorAll("[data-loadwin]").forEach(b=>b.onclick=()=>{UI.loadWin=+b.dataset.loadwin;render();});
  r.querySelectorAll("[data-loadmode]").forEach(b=>b.onclick=()=>{UI.loadMode=b.dataset.loadmode;render();});
  r.querySelectorAll("[data-ldweek]").forEach(b=>b.onclick=()=>openLoad(b.dataset.ldweek));
  r.querySelectorAll("[data-wkday]").forEach(b=>b.onclick=()=>openWeekSheet(monOf(b.dataset.wkday),b.dataset.wkday));
  r.querySelectorAll("[data-wkopen]").forEach(b=>b.onclick=()=>openWeekSheet(monOf(b.dataset.wkopen)));
  r.querySelectorAll("[data-loadopen]").forEach(b=>b.onclick=()=>openLoad(b.dataset.loadopen));
  {const s=r.querySelector("#lcSvg"); if(s)bindScrub(s,p=>{const ro=r.querySelector("#lcRO");if(ro)ro.innerHTML=loadRO(p);},p=>openLoad(p.d));}
  r.querySelectorAll("[data-recipe]").forEach(b=>b.onclick=()=>{UI.recipe=+b.dataset.recipe;render();});
  const fi=$("#fIn",r),dr=$("#drop",r);
  if(fi){fi.onchange=()=>{importFiles([...fi.files]);fi.value="";};dr.ondragover=e=>{e.preventDefault();dr.classList.add("over");};dr.ondragleave=()=>dr.classList.remove("over");dr.ondrop=e=>{e.preventDefault();dr.classList.remove("over");importFiles([...e.dataTransfer.files]);};}
  const cT=$("#cT",r);
  if(cT){const go=()=>{const s=pDur(cT.value),d=+$("#cD",r).value;$("#cO",r).textContent=s>0?"VDOT "+vdotFrom(d,s).toFixed(1)+" · marathon equivalent "+fDur(predict(vdotFrom(d,s),42195)):"Enter a race time to see its VDOT.";};cT.oninput=go;$("#cD",r).onchange=go;}
  const sv=$("#sSave",r);
  if(sv)sv.onclick=async()=>{const v=parseFloat($("#sV",r).value),g=$("#sG",r).value.trim(),L=parseInt($("#sL",r).value)||null,M=parseInt($("#sM",r).value)||null;
    if(!(v>=35&&v<=75)){toast("VDOT should be between 35 and 75");return;} if(!(pDur(g)>7200)){toast("Goal as h:mm:ss, for example 2:57:00");return;}
    if(!S.db){toast("Saving is unavailable right now");return;}
    const hist=(S.settings.history||[]).slice(); if(v!==+S.settings.vdot)hist.push({date:TODAY,vdot:+S.settings.vdot||52});
    sv.disabled=true;try{await S.db.doc("settings/main").set({...S.settings,vdot:v,goalMarathon:g,lthr:L,maxHr:M,history:hist,updated:new Date().toISOString()});toast("Inputs saved");}catch(e){toast("Couldn't save. Try again.");}finally{sv.disabled=false;}};
}
let rq=0,pend=false;const typing=()=>{const a=document.activeElement;return !!(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName));};
function sched(){cancelAnimationFrame(rq);rq=requestAnimationFrame(()=>{if(typing()||$("#scrim")){pend=true;return;}pend=false;render();});}
document.addEventListener("focusout",()=>setTimeout(()=>{if(pend&&!typing()&&!$("#scrim"))sched();},60));
new MutationObserver(()=>{if(pend&&!$("#scrim"))sched();}).observe($("#sheetRoot"),{childList:true});
render();
function startData(){
  if(S.db)return; hideSignin();
  const db=makeDb(SB); S.db=db;
  db.collection("weeks").onSnapshot(s=>{S.weeks={};s.docs.forEach(d=>{if(d.exists)S.weeks[d.id]=d.data();});S.loaded=true;sched();},()=>{S.loaded=true;sched();});
  db.collection("runs").onSnapshot(s=>{S.runs={};s.docs.forEach(d=>{if(d.exists)S.runs[d.id]=d.data();});sched();},()=>{});
  db.collection("lifts").onSnapshot(s=>{S.lifts={};s.docs.forEach(d=>{if(d.exists)S.lifts[d.id]=d.data();});sched();},()=>{});
  db.collection("log").onSnapshot(s=>{S.log={};s.docs.forEach(d=>{if(d.exists)S.log[d.id]=d.data();});sched();},()=>{});
  db.collection("notes").onSnapshot(s=>{S.notes=s.docs.filter(d=>d.exists).map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(b.date||"").localeCompare(String(a.date||"")));sched();},()=>{});
  db.collection("chat").onSnapshot(s=>{S.chat=s.docs.filter(d=>d.exists).map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(a.ts||"").localeCompare(String(b.ts||"")));sched();},()=>{});
  db.doc("settings/main").onSnapshot(d=>{if(d.exists)S.settings={vdot:52,goalMarathon:"2:57:00",...d.data()};sched();},()=>{});
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")db.refresh();});
}
(async function boot(){
  bindSignin();
  SB.auth.onAuthStateChange((ev,session)=>{ if(session&&!S.db) setTimeout(startData,0); if(ev==="SIGNED_OUT"){ location.replace(location.origin+location.pathname); } });
  const sess=(await SB.auth.getSession()).data.session;
  if(sess) startData(); else if(!S.db) showSignin();
})();
})();
</script>
